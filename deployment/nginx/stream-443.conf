# Port 443 router — lets TURN/TLS share 443 with every HTTPS site on the box.
#
# Install as /etc/nginx/stream.d/turaquant-443.conf, included from the TOP LEVEL
# of /etc/nginx/nginx.conf (outside `http {}`):
#     include /etc/nginx/stream.d/*.conf;
# Full procedure: deployment/LIVEKIT_PRODUCTION.md §12.
#
# Why: client / KOL corporate networks only allow 443 out, so the TURN relay
# must answer on 443 — but nginx already owns 443 for the websites. This reads
# the TLS SNI (hostname) without decrypting and forwards:
#   turn.turasphere.com  -> TURN (below, then LiveKit on 5349)
#   anything else        -> the HTTPS vhosts, now on 127.0.0.1:10443
#
# ⚠️ After this, NO http vhost may `listen 443 ssl` — every one must listen on
# 127.0.0.1:10443 instead, or nginx fails to bind. That includes sites CloudPanel
# creates in future: edit the new site's vhost straight away.
# (`listen 443 quic` lines are UDP and do not conflict; leave them.)

stream {
    map $ssl_preread_server_name $tq443_upstream {
        turn.turasphere.com  127.0.0.1:5350;
        default              127.0.0.1:10443;
    }

    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        # Carries the real client IP through to the vhosts (they set
        # real_ip_header proxy_protocol); otherwise every log line says 127.0.0.1.
        proxy_protocol on;
        proxy_pass $tq443_upstream;
        proxy_connect_timeout 10s;
        # Idle timeout. The default 10m would cut quiet WebSockets / TURN.
        proxy_timeout 1h;
    }

    # TURN/TLS: terminate TLS here with CloudPanel's certificate (renewals are
    # picked up by the nginx reload) and hand LiveKit plain TCP — LiveKit runs
    # with `external_tls: true`, so it expects exactly that.
    server {
        listen 127.0.0.1:5350 ssl proxy_protocol;
        ssl_certificate     /etc/nginx/ssl-certificates/turn.turasphere.com.crt;
        ssl_certificate_key /etc/nginx/ssl-certificates/turn.turasphere.com.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        proxy_pass 127.0.0.1:5349;
        proxy_connect_timeout 10s;
        proxy_timeout 1h;
    }
}
