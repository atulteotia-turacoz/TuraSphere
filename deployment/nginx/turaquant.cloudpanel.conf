# LIVE vhost for turaquant.turacoz.com, as actually deployed (2026-08-10).
#
# This is the CloudPanel-managed template — the `{{...}}` placeholders are filled
# in by CloudPanel and MUST be left as-is. Edit through the CloudPanel vhost
# editor, not by hand in /etc/nginx.
#
# Differs from turaquant.conf in this directory, which describes an older
# static-file layout (frontend served from /var/www/turaquant, backend on 8000).
# The live box proxies everything to node/uvicorn processes instead:
#
#   /api/             -> 127.0.0.1:8096   FastAPI
#   /egress-template  -> 127.0.0.1:8096   FastAPI (recording layout)
#   /uploads/         -> 127.0.0.1:8096   FastAPI
#   /admin            -> 127.0.0.1:3008   admin panel
#   /                 -> 127.0.0.1:3007   frontend (catch-all)
#
# LiveKit is NOT here — it has its own vhost at
# /etc/nginx/sites-enabled/livekit.turaquant.turacoz.com.conf, proxying
# livekit.turaquant.turacoz.com to 127.0.0.1:7890.

server {
    listen 80;
    listen [::]:80;
    listen 443 quic;
    listen 443 ssl;
    listen [::]:443 quic;
    listen [::]:443 ssl;
    http2 on;
    http3 off;
    {{ssl_certificate_key}}
    {{ssl_certificate}}
    server_name turaquant.turacoz.com;
    {{root}}
    {{nginx_access_log}}
    {{nginx_error_log}}

    if ($scheme != "https") {
      rewrite ^ https://$host$request_uri permanent;
    }

    location ~ /.well-known {
      auth_basic off;
      allow all;
    }

    {{settings}}

    include /etc/nginx/global_settings;

    index index.html;

    location /uwsgi {
      include uwsgi_params;
      uwsgi_read_timeout 3600;
      uwsgi_pass 127.0.0.1:{{app_port}};
    }

    # Backend API → port 8096
    location /api/ {
      proxy_pass http://127.0.0.1:8096/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 900;
      proxy_send_timeout 900;
      proxy_read_timeout 900;
    }

    # Egress recording layout → port 8096
    #
    # The egress container's headless Chrome loads this page to composite the
    # recording (EGRESS_TEMPLATE_BASE_URL in backend/.env points here).
    #
    # It NEEDS its own location. FastAPI mounts the static dir at
    # /egress-template (backend/app/main.py), which is outside the /api/ prefix,
    # so without this block the request falls through to the catch-all `location
    # /` below and returns the FRONTEND app with HTTP 200. Chrome then loads a
    # perfectly valid page that never logs START_RECORDING, and egress aborts
    # ~20s later with "Start signal not received" (412) — no page-load error, so
    # nothing in the logs points at nginx.
    #
    # No trailing slash on either side: that preserves the full URI, so
    # /egress-template/egress_template.html reaches FastAPI unchanged.
    #
    # Unauthenticated by design — egress carries no session, and the page holds
    # no secrets (room and token arrive as query params from egress itself).
    location /egress-template {
      proxy_pass http://127.0.0.1:8096;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin panel → port 3008
    location /admin {
      proxy_pass http://127.0.0.1:3008;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
      proxy_connect_timeout 900;
      proxy_send_timeout 900;
      proxy_read_timeout 900;
    }

    # Uploaded files → backend
    location /uploads/ {
      proxy_pass http://127.0.0.1:8096/uploads/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend → port 3007 (catch-all, must be last)
    location / {
      proxy_pass http://127.0.0.1:3007/;
      proxy_http_version 1.1;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Server $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
      proxy_pass_request_headers on;
      proxy_max_temp_file_size 0;
      proxy_connect_timeout 900;
      proxy_send_timeout 900;
      proxy_read_timeout 900;
      proxy_buffer_size 128k;
      proxy_buffers 4 256k;
      proxy_busy_buffers_size 256k;
      proxy_temp_file_write_size 256k;
    }

    if (-f $request_filename) {
      break;
    }
}
