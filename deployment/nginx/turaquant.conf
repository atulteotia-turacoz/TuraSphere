server {
    listen 80;
    server_name turaquant.turacoz.com;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name turaquant.turacoz.com;

    # SSL certificates (Let's Encrypt / Certbot)
    ssl_certificate     /etc/letsencrypt/live/turaquant.turacoz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/turaquant.turacoz.com/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Max upload size (for CV uploads)
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # ── Backend API: /api → FastAPI on port 8000 ──
    location /api {
        proxy_pass http://127.0.0.1:8000/api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }

    # ── Egress recording layout: /egress-template → FastAPI ──
    # The egress container's headless Chrome loads this page to composite the
    # recording. It MUST be its own location: FastAPI mounts it at
    # /egress-template (main.py), not under /api, so without this block the
    # request falls through to the catch-all `location /` below and returns the
    # React index.html. Chrome then loads a perfectly valid page that never logs
    # START_RECORDING, and egress aborts with "Start signal not received" (412)
    # about 20s later — with no page-load error to hint at what happened.
    #
    # Unauthenticated on purpose: egress has no session, and the page carries no
    # secrets — the room and token arrive as query params from egress itself.
    location /egress-template {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend docs (optional, remove in production if not needed)
    location /docs {
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # ── Admin Panel: /admin → static files ──
    location /admin {
        alias /var/www/turaquant/admin;
        try_files $uri $uri/ /admin/index.html;

        # Cache static assets
        location ~* /admin/static/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── Frontend: / → static files (catch-all) ──
    root /var/www/turaquant/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Zoom meeting embed: cross-origin isolation ──
    # The Zoom Web SDK needs SharedArrayBuffer, which browsers only expose on a
    # cross-origin-isolated document. Without these two headers the SDK's media
    # engine never initializes: mic and camera silently do nothing, and it cannot
    # render more than one video — so no participant grid.
    #
    # Mirrors frontend/src/setupProxy.js, which does the same for the dev server.
    # Scoped to the two routes that embed the SDK so the rest of the app (payment
    # iframes, external images, embeds) is unaffected. COEP "credentialless" lets
    # the Zoom CDN assets load without each needing a CORP header.
    location ^~ /meeting-room {
        add_header Cross-Origin-Opener-Policy   "same-origin"     always;
        add_header Cross-Origin-Embedder-Policy "credentialless"  always;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /meeting/join {
        add_header Cross-Origin-Opener-Policy   "same-origin"     always;
        add_header Cross-Origin-Embedder-Policy "credentialless"  always;
        try_files $uri $uri/ /index.html;
    }

    # Cache frontend static assets
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Uploaded files (CVs etc.)
    location /uploads {
        alias /var/www/turaquant/uploads;
        expires 30d;
    }
}
